---
name: "Commit Generated Files"
description: "Commit generated files to the PR branch, or fail with instructions when the PR comes from a fork."

inputs:
  paths:
    description: "Paths to commit."
    required: true
  commit-message:
    description: "Commit message."
    required: true
  fix-command:
    description: "Command that a contributor runs locally to update the files."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Check for changes"
      id: "git-check"
      shell: "bash"
      env:
        PATHS: "${{ inputs.paths }}"
      run: |
        # shellcheck disable=SC2086
        if [ -n "$(git status --porcelain -- $PATHS)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # The workflow token cannot push to a fork.
    - name: "Commit changes"
      if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository"
      shell: "bash"
      env:
        PATHS: "${{ inputs.paths }}"
        COMMIT_MESSAGE: "${{ inputs.commit-message }}"
        HEAD_REF: "${{ github.event.pull_request.head.ref }}"
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        # shellcheck disable=SC2086
        git add -- $PATHS
        git commit -m "$COMMIT_MESSAGE"
        # Another workflow may have pushed to the branch in the meantime.
        git pull --rebase origin "$HEAD_REF"
        git push origin "HEAD:refs/heads/${HEAD_REF}"

    - name: "Report out of date files"
      if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository"
      shell: "bash"
      env:
        PATHS: "${{ inputs.paths }}"
        FIX_COMMAND: "${{ inputs.fix-command }}"
      run: |
        # shellcheck disable=SC2086
        files="$(git status --porcelain -- $PATHS | awk '{print $2}')"
        echo "::error title=Generated files are out of date::Run '${FIX_COMMAND}' and commit the result."
        {
          echo "## Generated files are out of date"
          echo
          echo "This workflow cannot push to a fork. Run this command in your branch and commit the result:"
          echo
          echo '```'
          echo "$FIX_COMMAND"
          echo '```'
          echo
          echo "Files that changed:"
          echo
          echo "$files" | sed 's/^/- `/; s/$/`/'
        } >> "$GITHUB_STEP_SUMMARY"
        exit 1
