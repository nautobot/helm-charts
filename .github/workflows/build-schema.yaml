---
name: "Build Schema"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "develop"
      - "next"
    paths:
      - "charts/nautobot/schema/**"
      - "charts/nautobot/values.schema.json"
      - "tasks.py"
      - ".github/workflows/build-schema.yaml"

jobs:
  build-schema:
    runs-on: "ubuntu-26.04"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"

      - name: "Install poetry"
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Install dependencies"
        run: "poetry install --no-root"

      - name: "Build values.schema.json"
        run: "poetry run invoke build-schema"

      - name: "Check for changes"
        id: "git-check"
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: "Commit changes"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          HEAD_REF: "${{ github.event.pull_request.head.ref }}"
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add charts/nautobot/values.schema.json
          git commit -m "chore: Update values.schema.json"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      # The workflow token cannot push to a fork.
      - name: "Fail on stale schema in a fork"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository"
        run: |
          echo "::error::values.schema.json is out of date. Run 'invoke build-schema' and commit the result."
          exit 1
