---
name: "Update Dependencies"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "develop"
      - "next"
    paths:
      - "charts/nautobot/Chart.yaml"

jobs:
  update-dependencies:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"

      - name: "Set up Helm"
        uses: "azure/setup-helm@v5"

      - name: "Helm Dependency Update"
        run: |
          helm dependency update charts/nautobot

      - name: "Setup Go"
        uses: "actions/setup-go@v7"
      - run: "echo $HOME/go/bin >> $GITHUB_PATH"
      - name: "Install helm-docs"
        run: "go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.0"
        env:
          GO111MODULE: "on"

      - name: "Run helm-docs"
        run: "helm-docs"

      - name: "Check for changes"
        id: "git-check"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit changes"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          HEAD_REF: "${{ github.event.pull_request.head.ref }}"
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "chore: Update helm dependencies"
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      # The workflow token cannot push to a fork.
      - name: "Fail on out of date files in a fork"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository"
        run: |
          echo "::error title=Helm dependencies are out of date::Run 'helm dependency update charts/nautobot && helm-docs' and commit the result."
          {
            echo "## Helm dependencies are out of date"
            echo
            echo "Run this command in your branch and commit the result:"
            echo
            echo '```'
            echo "helm dependency update charts/nautobot && helm-docs"
            echo '```'
            echo
            echo "Changed files:"
            echo
            echo '```'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
