---
name: "Update Dependencies"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "develop"
      - "next"
    paths:
      - "charts/nautobot/Chart.yaml"

jobs:
  update-dependencies:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"

      - name: "Set up Helm"
        uses: "azure/setup-helm@v5"

      - name: "Helm Dependency Update"
        run: |
          helm dependency update charts/nautobot

      - name: "Setup Go"
        uses: "actions/setup-go@v7"
      - run: "echo $HOME/go/bin >> $GITHUB_PATH"
      - name: "Install helm-docs"
        run: "go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.0"
        env:
          GO111MODULE: "on"

      - name: "Run helm-docs"
        run: "helm-docs"

      - name: "Commit changes"
        uses: "./.github/actions/commit-generated-files"
        with:
          paths: "."
          commit-message: "chore: Update helm dependencies"
          fix-command: "helm dependency update charts/nautobot && helm-docs"
