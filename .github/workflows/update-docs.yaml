---
name: "Update Docs"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "develop"
      - "next"

jobs:
  update-docs:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"

      - name: "Setup Go"
        uses: "actions/setup-go@v7"

      - name: "Install helm-docs"
        run: "go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.0"
        env:
          GO111MODULE: "on"

      - name: "Update README.md"
        run: |
          helm-docs --chart-search-root=charts --template-files=README.md.gotmpl

      - name: "Update reference.md"
        run: |
          helm-docs --chart-to-generate=charts/nautobot --template-files=./docs/configuration/reference.md.gotmpl --output-file=../../docs/configuration/reference.md

      - name: "Check for changes"
        id: "git-check"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit changes"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          HEAD_REF: "${{ github.event.pull_request.head.ref }}"
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add .
          git commit -m "chore: Update docs"
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      # The workflow token cannot push to a fork.
      - name: "Fail on out of date files in a fork"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository"
        run: |
          echo "::error title=Docs are out of date::Run 'invoke update-docs' and commit the result."
          {
            echo "## Docs are out of date"
            echo
            echo "Run this command in your branch and commit the result:"
            echo
            echo '```'
            echo "invoke update-docs"
            echo '```'
            echo
            echo "Changed files:"
            echo
            echo '```'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
