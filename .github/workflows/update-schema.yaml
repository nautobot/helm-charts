---
name: "Update Schema"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "develop"
      - "next"
    paths:
      - "charts/nautobot/schema/**"
      - "charts/nautobot/values.schema.json"
      - "tasks.py"
      - ".github/workflows/update-schema.yaml"

jobs:
  update-schema:
    runs-on: "ubuntu-26.04"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"

      - name: "Install poetry"
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Install dependencies"
        run: "poetry install --no-root"

      - name: "Update values.schema.json"
        run: "poetry run invoke update-schema"

      - name: "Check for changes"
        id: "git-check"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commit changes"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          HEAD_REF: "${{ github.event.pull_request.head.ref }}"
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add charts/nautobot/values.schema.json
          git commit -m "chore: Update values.schema.json"
          git pull --rebase origin "${HEAD_REF}"
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      # The workflow token cannot push to a fork.
      - name: "Fail on out of date files in a fork"
        if: "steps.git-check.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name != github.repository"
        run: |
          echo "::error title=values.schema.json is out of date::Run 'invoke update-schema' and commit the result."
          {
            echo "## values.schema.json is out of date"
            echo
            echo "Run this command in your branch and commit the result:"
            echo
            echo '```'
            echo "invoke update-schema"
            echo '```'
            echo
            echo "Changed files:"
            echo
            echo '```'
            git status --short
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
