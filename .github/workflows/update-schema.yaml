---
name: "Update Schema"

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - "develop"
      - "next"
    paths:
      - "charts/nautobot/schema/**"
      - "charts/nautobot/values.schema.json"
      - "tasks.py"
      - ".github/actions/commit-generated-files/**"
      - ".github/workflows/update-schema.yaml"

jobs:
  update-schema:
    runs-on: "ubuntu-26.04"
    permissions:
      contents: "write"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
        with:
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
          ref: "${{ github.event.pull_request.head.ref }}"

      - name: "Install poetry"
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Install dependencies"
        run: "poetry install --no-root"

      - name: "Update values.schema.json"
        run: "poetry run invoke update-schema"

      - name: "Commit changes"
        uses: "./.github/actions/commit-generated-files"
        with:
          paths: "charts/nautobot/values.schema.json"
          commit-message: "chore: Update values.schema.json"
          fix-command: "invoke update-schema"
