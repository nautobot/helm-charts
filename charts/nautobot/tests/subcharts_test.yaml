---
suite: "Test Bitnami subcharts integration"
# Templates included by the StatefulSets for checksum annotations must be listed too.
templates:
  - "charts/postgresql/templates/primary/configmap.yaml"
  - "charts/postgresql/templates/primary/extended-configmap.yaml"
  - "charts/postgresql/templates/primary/statefulset.yaml"
  - "charts/postgresql/templates/primary/svc.yaml"
  - "charts/postgresql/templates/secrets.yaml"
  - "charts/redis/templates/configmap.yaml"
  - "charts/redis/templates/health-configmap.yaml"
  - "charts/redis/templates/scripts-configmap.yaml"
  - "charts/redis/templates/master/application.yaml"
  - "charts/redis/templates/master/service.yaml"
  - "charts/redis/templates/secret.yaml"
release:
  name: "test"
  namespace: "test"
set:
  postgresql:
    enabled: true
    auth:
      password: "change-me"
  redis:
    enabled: true
    auth:
      password: "change-me"
tests:

  - it: "PostgreSQL uses the pinned image"
    template: "charts/postgresql/templates/primary/statefulset.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: "registry-1.docker.io/bitnamilegacy/postgresql:15.4.0-debian-11-r45"

  - it: "PostgreSQL service name matches NAUTOBOT_DB_HOST"
    template: "charts/postgresql/templates/primary/svc.yaml"
    asserts:
      - equal:
          path: "metadata.name"
          value: "test-postgresql"

  - it: "PostgreSQL secret has the key Nautobot reads the password from"
    template: "charts/postgresql/templates/secrets.yaml"
    asserts:
      - equal:
          path: "metadata.name"
          value: "test-postgresql"
      - exists:
          path: "data.password"

  - it: "Redis uses the pinned image"
    template: "charts/redis/templates/master/application.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].image"
          value: "registry-1.docker.io/bitnamilegacy/redis:7.4.2-debian-12-r9"

  - it: "Redis service name matches NAUTOBOT_REDIS_HOST"
    template: "charts/redis/templates/master/service.yaml"
    asserts:
      - equal:
          path: "metadata.name"
          value: "test-redis-master"

  - it: "Redis secret has the key Nautobot reads the password from"
    template: "charts/redis/templates/secret.yaml"
    asserts:
      - equal:
          path: "metadata.name"
          value: "test-redis"
      - exists:
          path: "data.redis-password"

  - it: "PostgreSQL has no resource limits from the chart preset"
    template: "charts/postgresql/templates/primary/statefulset.yaml"
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].resources"
          value:
            requests:
              cpu: "250m"
              memory: "256Mi"

  - it: "Redis has no resource limits from the chart preset"
    template: "charts/redis/templates/master/application.yaml"
    asserts:
      - notExists:
          path: "spec.template.spec.containers[0].resources"

  - it: "Redis config does not load modules missing from the Redis 7 image"
    template: "charts/redis/templates/configmap.yaml"
    asserts:
      - notMatchRegex:
          path: "data[\"redis.conf\"]"
          pattern: "loadmodule"
      - matchRegex:
          path: "data[\"redis.conf\"]"
          pattern: "appendonly yes"
